apiVersion: blueprints.cloud.google.com/v1alpha1
kind: BlueprintMetadata
metadata:
  name: google-cloud-network-services-authz-extension-display
  annotations:
    config.kubernetes.io/local-config: "true"
spec:
  info:
    title: Google Cloud Network Services AuthzExtension
    source:
      repo: https://github.com/Daisyprakash/terraform-google-security-auth-policy.git
      sourceType: git
  ui:
    input:
      variables:
        action:
          name: action
          title: Action
        custom_provider:
          name: custom_provider
          title: Custom Provider
        description:
          name: description
          title: Description
        http_rules:
          name: http_rules
          title: Http Rules
        labels:
          name: labels
          title: Labels
        location:
          name: location
          title: Location
        name:
          name: name
          title: Name
        policy_profile:
          name: policy_profile
          title: Policy Profile
        project_id:
          name: project_id
          title: Project Id
        target:
          name: target
          title: Target
    runtime:
      outputs:
        id:
          visibility: VISIBILITY_ROOT
